{% extends "base.html" %}

{% block conteudo %}
    <h1>Criar Atividade</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Criar Atividade</button>
    </form>

    <br>

    <a href="{% url 'eventos:programacao' %}">Voltar para programação</a>
{% endblock %}
