{% extends "base.html" %}

{% block conteudo %}

    <h1>Editar Atividade</h1>

    {% if messages %}
        {% for message in messages %}
            <p>{{ message }}</p>
        {% endfor %}
    {% endif %}

    <p>Evento: {{ evento.nome }}</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Salvar Alterações
        </button>
    </form>

    <br>

    <a href="{% url 'eventos:programacao' %}">
        Voltar para programação
    </a>

{% endblock %}
