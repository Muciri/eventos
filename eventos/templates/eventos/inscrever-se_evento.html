{% extends "base.html" %}

{% block conteudo %}

    <h1>Inscrever-se em Atividade</h1>

    <p>
        Tem certeza que deseja se inscrever?
        <strong>{{ atividade.titulo }}</strong>
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Confirmar Inscrição
        </button>
    </form>

    <br>

    <a href="{% url 'eventos:programacao' %}">
        Cancelar
    </a>

{% endblock %}
